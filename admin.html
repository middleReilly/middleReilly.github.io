<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reilly White — Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap"
        rel="stylesheet">

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navigation is injected by nav.js -->

  <main class="page-container">

    <!-- ─── Admin Container ───
         This div is swapped between the lock screen and
         the dashboard by admin.js based on auth state. -->
    <div id="admin-container">
      <!-- admin.js will populate this -->
      <div class="lock-screen">
        <p style="color:var(--sage);">Loading...</p>
      </div>
    </div>

  </main>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared scripts -->
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>

  <!-- Initialize Supabase, then load admin logic -->
  <script>
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <script src="js/writings.js"></script>  <!-- shared helpers (escapeHtml, formatDate) -->
  <script src="js/projects.js"></script> <!-- shared helpers (escapeHtmlSafe) -->
  <script src="js/admin.js"></script>
</body>
</html>
